name: CBB Owls Best Odds Archive
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Capture mode
        required: true
        default: hourly
        type: choice
        options: [hourly, close]
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths: [.github/workflows/cbb_owls_best_odds_archive.yml, scripts/market_readiness.py]
permissions:
  contents: read
concurrency:
  group: cbb-owls-best-odds-archive
  cancel-in-progress: false
jobs:
  archive:
    if: vars.CBB_MARKET_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Check upcoming published slate; off-season stays idle
        id: readiness
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
          OWLS_INSIGHT_API_KEY: ${{ secrets.OWLS_INSIGHT_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/market_readiness.py | tee market-readiness.json
      - name: Archive hourly odds on production only
        if: github.ref == 'refs/heads/main' && (steps.readiness.outputs.active == 'true' || github.event_name == 'workflow_dispatch')
        env:
          OWLS_INSIGHT_API_KEY: ${{ secrets.OWLS_INSIGHT_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CAPTURE_MODE: ${{ inputs.mode || 'hourly' }}
        run: python scripts/archive_owls_best_odds.py --mode "$CAPTURE_MODE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-readiness
          path: market-readiness.json
          retention-days: 7
