name: Temporary source audit
on:
  push:
    branches: [fix/automation-lifecycle-20260913]
    paths: [.github/workflows/source_audit.yml]
permissions:
  contents: read
jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: |
          git archive --format=tar.gz --output="$RUNNER_TEMP/source-snapshot.tar.gz" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/source-revision.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: source-audit
          path: |
            ${{ runner.temp }}/source-snapshot.tar.gz
            ${{ runner.temp }}/source-revision.txt
          retention-days: 1
          if-no-files-found: error
