name: Automation and Archive Regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pip install --dry-run -r requirements-automation.lock
      - run: bash -n scripts/install_cbb_model_refresh_launchd.sh scripts/install_cbb_auto_grade_launchd.sh
      - run: python -m pytest -q tests/test_launchd_installers.py tests/test_cbb_forecast_dispatcher.py tests/test_headless_package_import.py tests/test_automation_ordering.py tests/test_automation_archive.py tests/test_automation_grading.py tests/test_final_integrity.py
      - run: python -m compileall -q app.py cbb_dashboard scripts stat_factory_archives.py stat_factory_board_order.py
