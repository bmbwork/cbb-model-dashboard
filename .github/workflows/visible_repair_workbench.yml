name: Visible dashboard repair workbench
on:
  push:
    branches: [fix/visible-dashboard-corrections-20260914]
    paths: [.github/workflows/visible_repair_workbench.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Connect bundled assets to the active renderer
        shell: python
        run: |
          from pathlib import Path
          p=Path('cbb_dashboard/premium_ui_patch.py');s=p.read_text()
          old='    url = team_logo_url(team, game_date)';assert old in s
          s=s.replace(old,'    from .team_logos import bundled_logo_source\n    url = bundled_logo_source(team) or team_logo_url(team, game_date)',1);p.write_text(s)
          p=Path('app.py');s=p.read_text().replace('APP_VERSION = "1.6.1"','APP_VERSION = "1.6.2"');p.write_text(s)
          p=Path('tests/test_logo_scoreboard_and_splits.py');s=p.read_text()
          needle='    monkeypatch.setattr(premium_ui_patch, "team_logo_url", fake_logo)';assert needle in s
          s=s.replace(needle,'    from cbb_dashboard import team_logos\n    monkeypatch.setattr(team_logos, "bundled_logo_source", lambda team: "")\n'+needle);p.write_text(s)
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_bundled_logos.py tests/test_logo_scoreboard_and_splits.py tests/test_conference_moneybar_logo_qa.py
      - run: python -m compileall -q app.py cbb_dashboard
      - name: Inspect real published team coverage without database writes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
        shell: python
        run: |
          import json, os, pathlib
          import pandas as pd
          from supabase import create_client
          from cbb_dashboard.team_logos import bundled_logo_source
          from cbb_dashboard.intelligence import game_card_grid_html
          from cbb_dashboard.ui import GLOBAL_CSS
          c=create_client(os.environ['SUPABASE_URL'],os.environ['SUPABASE_SERVICE_ROLE_KEY'])
          slates=c.table('cbb_slates').select('slate_date,board_json').order('slate_date',desc=True).execute().data
          teams=sorted({str(row.get(k) or '') for s in slates for row in s['board_json'] for k in ('Away Team','Home Team')})
          missing=[t for t in teams if t and not bundled_logo_source(t)]
          report={'published_teams':len(teams),'matched_teams':len(teams)-len(missing),'missing':missing,'database_writes':0}
          pathlib.Path('logo-coverage.json').write_text(json.dumps(report,indent=2));print(json.dumps(report))
          pathlib.Path('cbb-logo-verified.html').write_text(GLOBAL_CSS+game_card_grid_html(pd.DataFrame(slates[0]['board_json']).head(4)))
      - name: Commit only tested display integration
        run: |
          git config user.name 'Stat Factory maintenance'
          git config user.email 'noreply@users.noreply.github.com'
          git add app.py cbb_dashboard/premium_ui_patch.py tests/test_logo_scoreboard_and_splits.py
          git commit -m 'Render real CBB team logos from the bundled verified asset directory'
          git push origin HEAD:fix/visible-dashboard-corrections-20260914
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cbb-logo-render-verification
          path: |
            logo-coverage.json
            cbb-logo-verified.html
          retention-days: 7
