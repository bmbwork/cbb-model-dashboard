name: Visible dashboard repair workbench
on:
  push:
    branches: [fix/visible-dashboard-corrections-20260914]
    paths: [.github/workflows/visible_repair_workbench.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked dashboard source only
        shell: python
        run: |
          import pathlib, subprocess, tarfile
          names = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          with tarfile.open('dashboard-source.tar.gz','w:gz') as archive:
              for name in names:
                  if not name or name.startswith('production_model/'):
                      continue
                  path = pathlib.Path(name)
                  if path.name in {'.env','secrets.toml'} or path.is_symlink() or not path.is_file():
                      continue
                  if path.stat().st_size <= 5000000 and path.suffix.lower() in {'.py','.json','.md','.txt','.toml','.yml','.yaml','.csv','.sh','.command','.sql','.html','.png','.svg'}:
                      archive.add(path,arcname=name)
          pathlib.Path('revision.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD']).decode())
      - uses: actions/upload-artifact@v4
        with:
          name: visible-dashboard-source
          path: |
            dashboard-source.tar.gz
            revision.txt
          retention-days: 2
