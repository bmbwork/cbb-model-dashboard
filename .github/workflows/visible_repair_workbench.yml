name: Visible dashboard repair workbench
on:
  push:
    branches: [fix/visible-dashboard-corrections-20260914]
    paths: [.github/workflows/visible_repair_workbench.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest Pillow playwright
      - run: python -m playwright install --with-deps chromium
      - name: Resolve historical team names from their original ESPN scoreboard
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
        shell: python
        run: |
          import hashlib, io, json, os, pathlib
          import pandas as pd
          import requests
          from PIL import Image
          from supabase import create_client
          from cbb_dashboard.team_logos import ASSET_ROOT, _directory, _key, bundled_logo_source
          c=create_client(os.environ['SUPABASE_URL'],os.environ['SUPABASE_SERVICE_ROLE_KEY'])
          slates=c.table('cbb_slates').select('slate_date,board_json').order('slate_date',desc=True).execute().data
          payload=json.loads((ASSET_ROOT/'directory.json').read_text()); records={r['id']:r for r in payload['teams']}
          wanted={str(row[k]) for s in slates for row in s['board_json'] for k in ('Away Team','Home Team')}
          missing={t for t in wanted if not bundled_logo_source(t)}
          for slate in slates:
              url='https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball/scoreboard?dates='+slate['slate_date'].replace('-','')+'&groups=50&limit=500'
              response=requests.get(url,timeout=40);response.raise_for_status()
              for event in response.json().get('events',[]):
                  for game in event.get('competitions',[]):
                      for competitor in game.get('competitors',[]):
                          team=competitor.get('team',{}); ident=str(team.get('id',''))
                          aliases=[team.get(k) for k in ('location','displayName','shortDisplayName','abbreviation','slug') if team.get(k)]
                          matching={t for t in missing if _key(t) in {_key(a) for a in aliases}}
                          if not matching: continue
                          if ident not in records:
                              image_url=team.get('logo','')
                              if not image_url.startswith('https://a.espncdn.com/'): continue
                              raw=requests.get(image_url,timeout=20);raw.raise_for_status()
                              image=Image.open(io.BytesIO(raw.content));image.load();image=image.convert('RGBA');image.thumbnail((128,128))
                              asset=ASSET_ROOT/(ident+'.png');image.save(asset,optimize=True)
                              records[ident]={'id':ident,'display_name':team.get('displayName'),'aliases':aliases,'source_url':image_url,'asset':ident+'.png','sha256':hashlib.sha256(asset.read_bytes()).hexdigest()}
                          records[ident]['aliases']=sorted(set(records[ident]['aliases']+aliases+list(matching)))
                          records[ident]['historical_identity_source']=url
          # Exact historical display aliases for the same ESPN identity, not fuzzy matching.
          records['2443']['aliases']=sorted(set(records['2443']['aliases']+['New Orleans']))
          records['2900']['aliases']=sorted(set(records['2900']['aliases']+['St. Thomas-Minnesota']))
          payload['teams']=list(records.values());(ASSET_ROOT/'directory.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          _directory.cache_clear();bundled_logo_source.cache_clear()
          missing=sorted(t for t in wanted if not bundled_logo_source(t))
          report={'published_teams':len(wanted),'matched_teams':len(wanted)-len(missing),'missing':missing,'database_writes':0}
          pathlib.Path('logo-coverage.json').write_text(json.dumps(report,indent=2));print(json.dumps(report))
          from cbb_dashboard.intelligence import game_card_grid_html
          from cbb_dashboard.ui import GLOBAL_CSS
          from cbb_dashboard.premium_ui_patch import PREMIUM_CSS
          pathlib.Path('cbb-logo-verified.html').write_text(GLOBAL_CSS+PREMIUM_CSS+game_card_grid_html(pd.DataFrame(slates[0]['board_json']).head(4)))
      - run: python -m pytest -q tests/test_bundled_logos.py tests/test_logo_scoreboard_and_splits.py tests/test_conference_moneybar_logo_qa.py
      - name: Browser-render actual published CBB cards
        shell: python
        run: |
          import json,pathlib
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser=p.chromium.launch();page=browser.new_page(viewport={'width':1400,'height':1100})
              page.goto(pathlib.Path('cbb-logo-verified.html').resolve().as_uri());page.wait_for_timeout(1500)
              images=page.locator('.cbb-logo-matchup img').evaluate_all('(imgs)=>imgs.map(i=>({alt:i.alt,width:i.naturalWidth,height:i.naturalHeight}))')
              assert len(images)==8 and all(i['width']>0 for i in images), images
              page.screenshot(path='cbb-logo-verified.png',full_page=True)
              pathlib.Path('browser-image-verification.json').write_text(json.dumps(images,indent=2));print(json.dumps(images))
              browser.close()
      - name: Commit only verified historical identity assets
        run: |
          git config user.name 'Stat Factory maintenance'
          git config user.email 'noreply@users.noreply.github.com'
          git add assets/cbb_teams
          git diff --cached --quiet || git commit -m 'Resolve historical CBB team names against verified logo identities'
          git push origin HEAD:fix/visible-dashboard-corrections-20260914
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cbb-browser-verification
          path: |
            logo-coverage.json
            cbb-logo-verified.html
            cbb-logo-verified.png
            browser-image-verification.json
          retention-days: 7
