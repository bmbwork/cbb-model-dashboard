name: Visible dashboard repair workbench
on:
  push:
    branches: [fix/visible-dashboard-corrections-20260914]
    paths: [.github/workflows/visible_repair_workbench.yml]
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r requirements.txt Pillow pytest
      - name: Bundle the verified official Red Flash identity
        shell: python
        run: |
          import hashlib,io,json
          import requests
          from PIL import Image
          from cbb_dashboard.team_logos import ASSET_ROOT
          source='https://www.espn.com/mens-college-basketball/team/roster/_/id/2598/st-francis-u-red-flash'
          ident='2598';url='https://a.espncdn.com/i/teamlogos/ncaa/500/2598.png'
          result=requests.get(url,timeout=20);result.raise_for_status()
          image=Image.open(io.BytesIO(result.content));image.load();image=image.convert('RGBA');image.thumbnail((128,128))
          asset=ASSET_ROOT/(ident+'.png');image.save(asset,optimize=True)
          payload=json.loads((ASSET_ROOT/'directory.json').read_text()); records={r['id']:r for r in payload['teams']}
          aliases=['St. Francis (PA)','Saint Francis (PA)','Saint Francis','Saint Francis Red Flash','St. Francis U','SFPA']
          records[ident]={'id':ident,'display_name':'Saint Francis Red Flash','aliases':aliases,'source_url':url,'asset':ident+'.png','sha256':hashlib.sha256(asset.read_bytes()).hexdigest(),'historical_identity_source':source}
          payload['teams']=list(records.values());(ASSET_ROOT/'directory.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
      - run: python -m pytest -q tests/test_bundled_logos.py
      - name: Verify every currently published team has bundled image bytes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
        shell: python
        run: |
          import json,os,pathlib
          from supabase import create_client
          from cbb_dashboard.team_logos import bundled_logo_source
          c=create_client(os.environ['SUPABASE_URL'],os.environ['SUPABASE_SERVICE_ROLE_KEY'])
          slates=c.table('cbb_slates').select('board_json').execute().data
          teams={str(r[k]) for s in slates for r in s['board_json'] for k in ('Away Team','Home Team')}
          missing=sorted(t for t in teams if not bundled_logo_source(t)); assert not missing,missing
          report={'published_teams':len(teams),'matched_teams':len(teams),'missing':[],'database_writes':0}
          pathlib.Path('logo-coverage.json').write_text(json.dumps(report,indent=2));print(json.dumps(report))
      - name: Commit verified final asset
        run: |
          git config user.name 'Stat Factory maintenance'
          git config user.email 'noreply@users.noreply.github.com'
          git add assets/cbb_teams
          git commit -m 'Match historical St Francis PA name to verified Red Flash logo'
          git push origin HEAD:fix/visible-dashboard-corrections-20260914
      - uses: actions/upload-artifact@v4
        with:
          name: cbb-complete-logo-coverage
          path: logo-coverage.json
          retention-days: 7
