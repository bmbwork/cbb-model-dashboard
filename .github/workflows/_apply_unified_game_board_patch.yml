name: Apply unified Game Board patch

on:
  push:
    branches:
      - feat/unified-game-board-20260911

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/unified-game-board-20260911
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/apply_unified_game_board_patch.py
      - name: Validate app syntax
        run: python -m py_compile app.py
      - name: Commit transformed app
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/_apply_unified_game_board_patch.yml
          rm scripts/apply_unified_game_board_patch.py
          git add app.py .github/workflows/_apply_unified_game_board_patch.yml scripts/apply_unified_game_board_patch.py
          git commit -m "Unify CBB Game Board navigation and ranked-game UX"
          git push origin HEAD:feat/unified-game-board-20260911
