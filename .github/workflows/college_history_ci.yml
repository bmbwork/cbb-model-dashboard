name: College History Contract CI
on:
  pull_request:
    paths: ['scripts/collect_college_history.py', 'tests/test_college_history_contract.py', '.github/workflows/college_history*']
  push:
    branches: [main]
    paths: ['scripts/collect_college_history.py', 'tests/test_college_history_contract.py', '.github/workflows/college_history*']
permissions:
  contents: read
jobs:
  history:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5
      - run: python tests/test_college_history_contract.py
