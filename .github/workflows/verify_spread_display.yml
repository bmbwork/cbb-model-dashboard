name: Verify graded CBB spread display
on:
  push:
    branches: [fix/graded-spread-display-20260914]
    paths: [.github/workflows/verify_spread_display.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/graded-spread-display-20260914
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Activate the fresh spread renderer in the entrypoint
        shell: python
        run: |
          from pathlib import Path
          p=Path('app.py');s=p.read_text()
          old='st.markdown(GLOBAL_CSS, unsafe_allow_html=True)';assert old in s
          s=s.replace(old,'from cbb_dashboard.spread_display import install_spread_display\ninstall_spread_display()\n'+old,1)
          s=s.replace('APP_VERSION = "1.6.2"','APP_VERSION = "1.6.3"')
          p.write_text(s)
      - run: python -m pip install -q -r requirements.txt pytest
      - run: python -m pytest -q tests/test_spread_display.py tests/test_bundled_logos.py tests/test_logo_scoreboard_and_splits.py tests/test_conference_moneybar_logo_qa.py
      - run: python -m compileall -q app.py cbb_dashboard
      - name: Render the real saved Illinois-UConn final without database writes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
        shell: python
        run: |
          import json,os,pathlib
          import pandas as pd
          from supabase import create_client
          from cbb_dashboard.data import normalize_board,attach_grading
          from cbb_dashboard.spread_display import install_spread_display,graded_spread
          from cbb_dashboard.intelligence import game_card_grid_html
          from cbb_dashboard.ui import GLOBAL_CSS
          from cbb_dashboard.premium_ui_patch import PREMIUM_CSS
          c=create_client(os.environ['SUPABASE_URL'],os.environ['SUPABASE_SERVICE_ROLE_KEY'])
          r=c.table('cbb_slates').select('*').eq('slate_date','2026-04-04').execute().data[0]
          board,_=normalize_board(pd.DataFrame(r['board_json']))
          board=attach_grading(board,pd.DataFrame(r.get('grading_json') or []))
          row=board[(board['Away Team']=='Illinois')&(board['Home Team']=='UConn')].iloc[0]
          result=graded_spread(row)
          assert result['result']=='L' and result['kind']=='model',result
          assert abs(result['clearance'] - (62 - 71 + float(row['Fair Spread']))) < 1e-9,result
          assert round(result['clearance'],1)==-13.3
          install_spread_display();html=game_card_grid_html(board)
          assert 'MODEL LINE <strong>L</strong>' in html and 'data:image/png;base64,' in html
          pathlib.Path('cbb-graded-spread.html').write_text(GLOBAL_CSS+PREMIUM_CSS+html)
          pathlib.Path('cbb-graded-spread.json').write_text(json.dumps({**result,'database_writes':0},indent=2));print(json.dumps(result))
      - name: Commit tested entrypoint only
        run: |
          git config user.name 'Stat Factory maintenance'
          git config user.email 'noreply@users.noreply.github.com'
          git add app.py
          git commit -m 'Display source-labeled CBB final spread decisions on live game cards'
          git push origin HEAD:fix/graded-spread-display-20260914
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cbb-graded-spread-verification
          path: |
            cbb-graded-spread.html
            cbb-graded-spread.json
          retention-days: 7
