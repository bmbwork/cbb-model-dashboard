name: CBB Game Board CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m py_compile app.py cbb_dashboard/intelligence.py cbb_dashboard/public_consensus.py cbb_dashboard/premium_ui_patch.py cbb_dashboard/conference_context.py cbb_dashboard/conference_filter_runtime.py
      - run: python -m pytest -q tests/test_unified_game_board.py tests/test_intelligence.py tests/test_conference_moneybar_logo_qa.py
      - run: python -m pytest -q tests/test_college_research.py tests/test_college_bottom_line.py tests/test_unified_cfb_style_ui_20260924.py
      - run: python -m pytest -q tests/test_split_reliability.py tests/test_premium_money_flow_ui.py tests/test_owls_odds_v1_4_8.py tests/test_best_odds_archive_v1_5_0.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/health-splits.test.cjs
