name: CBB Game Board CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m py_compile app.py cbb_dashboard/intelligence.py cbb_dashboard/public_consensus.py
      - run: python -m pytest -q tests/test_unified_game_board.py tests/test_intelligence.py tests/test_market.py
