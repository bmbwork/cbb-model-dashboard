name: CBB V1.1.3B Historical Effectiveness 500

on:
  push:
    branches:
      - "research/cbb-historical-500-20260924"
    paths:
      - ".github/workflows/research_cbb_historical_500.yml"
      - "scripts/research_cbb_historical_500.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cbb-v113b-historical-500
  cancel-in-progress: false

jobs:
  historical-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      PYTHONPATH: .
      SUPABASE_URL: https://mtiwegegbmheefqombrw.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
      CBBD_API_KEY: ${{ secrets.CBBD_API_KEY || secrets.BEARER_TOKEN }}

    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dashboard dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify required credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}" || { echo "Supabase server key is not configured"; exit 1; }
          test -n "${CBBD_API_KEY:-}" || { echo "CBBD_API_KEY is not configured"; exit 1; }
          echo "Required research credentials are configured."

      - name: Download and verify frozen CBB V1.1.3B champion
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research-runtime research-output
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path, PurePosixPath
          import zipfile
          from supabase import create_client

          expected = "9f19e60919a676e842b54093b8d000478a3c228fc8328a6a4c8354abff576452"
          client = create_client(os.environ["SUPABASE_URL"], os.environ["SUPABASE_SERVICE_ROLE_KEY"])
          payload = client.storage.from_("cbb").download("cbb/production/CBB_V1_1_3B_Champion.zip")
          actual = hashlib.sha256(payload).hexdigest()
          if actual != expected:
              raise SystemExit(f"CBB champion SHA mismatch: {actual} != {expected}")

          archive = Path("research-runtime/CBB_V1_1_3B_Champion.zip")
          archive.write_bytes(payload)
          dest = Path("research-runtime/model")
          dest.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(archive) as zf:
              for info in zf.infolist():
                  rel = PurePosixPath(info.filename)
                  if rel.is_absolute() or ".." in rel.parts:
                      raise SystemExit(f"Unsafe archive path: {info.filename}")
                  target = dest / Path(*rel.parts)
                  if info.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(zf.read(info))

          roots = [p.parent for p in dest.rglob("run_cbb_champion.sh")]
          if len(roots) != 1:
              raise SystemExit(f"Expected one champion root, found {len(roots)}")
          Path("research-output/cbb-model-root.txt").write_text(str(roots[0].resolve()) + "\n")
          print("Frozen CBB champion verified and extracted.")
          PY
          MODEL_ROOT="$(cat research-output/cbb-model-root.txt)"
          echo "MODEL_ROOT=$MODEL_ROOT" >> "$GITHUB_ENV"

      - name: Install frozen champion dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r "$MODEL_ROOT/requirements.txt"

      - name: Configure ephemeral model credential file
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          {
            printf 'CBBD_API_KEY=%s\n' "$CBBD_API_KEY"
            printf 'BEARER_TOKEN=%s\n' "$CBBD_API_KEY"
          } > "$MODEL_ROOT/.env"

      - name: Run read-only historical replay
        shell: bash
        run: |
          set -euo pipefail
          python scripts/research_cbb_historical_500.py \
            --model-root "$MODEL_ROOT" \
            --start 2025-11-03 \
            --end 2026-03-08 \
            --max-games 500 \
            --output-dir research-output/cbb-historical-500 \
            | tee research-output/cbb-historical-500-console.json

      - name: Remove ephemeral credential file
        if: always()
        shell: bash
        run: rm -f "$MODEL_ROOT/.env"

      - name: Upload historical-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbb-v113b-historical-500-${{ github.run_id }}
          path: |
            research-output/cbb-historical-500/
            research-output/cbb-historical-500-console.json
          if-no-files-found: warn
          retention-days: 30
