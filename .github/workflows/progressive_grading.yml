name: CBB Progressive Final Grading
on:
  push:
    branches: [main, fix/automation-runtime-resume-20260913]
    paths: [.github/workflows/progressive_grading.yml, scripts/grade_published.py, cbb_dashboard/final_results.py]
  workflow_dispatch:
    inputs:
      apply:
        description: Persist verified final scores
        type: boolean
        default: false
  schedule:
    - cron: '11,26,41,56 * * * *'
permissions:
  contents: read
concurrency:
  group: cbb-final-score-grading
  cancel-in-progress: false
jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_automation_grading.py tests/test_final_integrity.py
      - name: Resolve finals; off-season without recent slates is idle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
          APPLY: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.apply == true || github.event_name == 'push') }}
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import os,json; print(json.dumps({"provider_key_configured":bool(os.environ.get("CBBD_API_KEY"))}))'
          ARGS=()
          if [ "$APPLY" = 'true' ]; then ARGS+=(--apply); fi
          python scripts/grade_published.py "${ARGS[@]}" | tee grading-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grading-summary
          path: grading-summary.json
          retention-days: 7
