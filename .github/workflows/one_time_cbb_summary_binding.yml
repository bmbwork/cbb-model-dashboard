name: One-time CBB live summary binding
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one_time_cbb_summary_binding.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/apply_cbb_summary_entrypoint.py
      - run: python -m pip install -q -r requirements.txt pytest
      - run: python -m compileall -q app.py cbb_dashboard
      - run: python -m pytest -q tests/test_board_record_summary.py tests/test_board_summary_runtime.py tests/test_spread_display.py tests/test_bundled_logos.py tests/test_logo_scoreboard_and_splits.py tests/test_conference_moneybar_logo_qa.py
      - name: Publish the tested entrypoint change
        run: |
          git config user.name 'Stat Factory maintenance'
          git config user.email 'noreply@users.noreply.github.com'
          git add app.py
          git commit -m 'Activate CBB summary cards in the live Streamlit entrypoint'
          git push origin HEAD:main
