name: Summary card integration
# Branch-only one-time integration runner; removed before merge.
on:
  push:
    branches: [feat/cfb-style-summary-record-cards-20260914]
    paths: [.github/workflows/summary_card_integration.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cfb-style-summary-record-cards-20260914
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add six CFB-style record cards to the active CBB Game Board
        shell: python
        run: |
          from pathlib import Path
          p=Path('app.py');s=p.read_text()
          anchor='from cbb_dashboard.best_odds_archive import attach_best_odds_to_board'
          assert s.count(anchor)==1
          s=s.replace(anchor,anchor+'\nfrom cbb_dashboard.board_record_summary import summary_cards as board_record_summary_cards',1)
          anchor='''    if filtered.empty:
        st.info("No games match these filters. Widen the odds/ranking/confidence range or choose a different slate date.")
        return

    limit_choice = st.segmented_control'''
          assert s.count(anchor)==1
          replacement='''    if filtered.empty:
        st.info("No games match these filters. Widen the odds/ranking/confidence range or choose a different slate date.")
        return

    summary = board_record_summary_cards(filtered)
    summary_cols = st.columns(6)
    for column, (label, value, foot) in zip(summary_cols, summary):
        with column:
            metric_card(label, value, foot)

    limit_choice = st.segmented_control'''
          s=s.replace(anchor,replacement,1)
          p.write_text(s)
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m compileall -q app.py cbb_dashboard
      - run: python -m pytest -q tests/test_board_record_summary.py tests/test_spread_display.py tests/test_logo_scoreboard_and_splits.py
      - name: Verify a real graded CBB slate read-only
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
        shell: python
        run: |
          import json, os, pathlib
          import pandas as pd
          from supabase import create_client
          from cbb_dashboard.data import normalize_board, attach_grading
          from cbb_dashboard.board_filters import enrich_filter_fields
          from cbb_dashboard.board_record_summary import summary_cards
          c=create_client(os.environ['SUPABASE_URL'],os.environ['SUPABASE_SERVICE_ROLE_KEY'])
          rows=c.table('cbb_slates').select('slate_date,board_json,grading_json').eq('slate_date','2026-04-04').execute().data
          assert rows
          board,_=normalize_board(pd.DataFrame(rows[0]['board_json']))
          board=attach_grading(board,pd.DataFrame(rows[0].get('grading_json') or []))
          board=enrich_filter_fields(board)
          cards=summary_cards(board);values={a:(b,c) for a,b,c in cards}
          assert len(cards)==6
          assert values['ML record'][0] != '—'
          assert values['Spread record'][0] != '—'
          pathlib.Path('cbb-summary-verification.json').write_text(json.dumps({'slate_date':'2026-04-04','cards':cards,'database_writes':0},indent=2))
          print(json.dumps({'slate_date':'2026-04-04','cards':cards,'database_writes':0}))
      - name: Commit tested active-page integration
        run: |
          git config user.name 'Stat Factory maintenance'
          git config user.email 'noreply@users.noreply.github.com'
          git add app.py
          git commit -m 'Show CFB-style record cards on the CBB Game Board'
          git push origin HEAD:feat/cfb-style-summary-record-cards-20260914
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cbb-summary-card-verification
          path: cbb-summary-verification.json
          retention-days: 7
