name: Apply CBB consensus UI patch

on:
  push:
    branches: ["feat/unified-game-board-20260911"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/unified-game-board-20260911
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_consensus_ui_patch.py
      - run: python -m py_compile app.py cbb_dashboard/intelligence.py cbb_dashboard/public_consensus.py
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/_apply_consensus_ui_patch.yml scripts/apply_consensus_ui_patch.py
          git add app.py cbb_dashboard/intelligence.py .github/workflows/_apply_consensus_ui_patch.yml scripts/apply_consensus_ui_patch.py
          git commit -m "Attach aggregate public consensus to CBB game cards"
          git push origin HEAD:feat/unified-game-board-20260911
