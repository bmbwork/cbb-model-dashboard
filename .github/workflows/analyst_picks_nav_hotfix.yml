name: Analyst Picks Navigation Hotfix

on:
  push:
    branches:
      - hotfix/analyst-picks-rollout
    paths:
      - .github/workflows/analyst_picks_nav_hotfix.yml

permissions:
  contents: write

jobs:
  patch-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch custom navigation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app.py")
          text = path.read_text()

          import_line = "from cbb_dashboard.ui import GLOBAL_CSS, esc, fmt_num, fmt_pct, fmt_spread\n"
          analyst_import = "from stat_factory_analyst_picks import render_stat_factory_analyst_picks\n"
          if analyst_import not in text:
              if import_line not in text:
                  raise SystemExit("CBB UI import anchor not found")
              text = text.replace(import_line, import_line + analyst_import, 1)

          old_pages = '    public_pages = ["Today\'s Board", "Market Terminal", "Matchup Explorer", "Team Intelligence", "Performance Lab", "Model Guide"]'
          new_pages = '    public_pages = ["Today\'s Board", "Analyst Picks", "Market Terminal", "Matchup Explorer", "Team Intelligence", "Performance Lab", "Model Guide"]'
          if old_pages in text:
              text = text.replace(old_pages, new_pages, 1)
          elif new_pages not in text:
              raise SystemExit("CBB navigation anchor not found")

          anchor = '    st.markdown(f\'<div class="small-muted" style="margin-top:1rem">Betting Intelligence v{APP_VERSION}</div>\', unsafe_allow_html=True)\n\nrecord: dict[str, Any] | None = None\n'
          block = '''    st.markdown(f'<div class="small-muted" style="margin-top:1rem">Betting Intelligence v{APP_VERSION}</div>', unsafe_allow_html=True)

if page == "Analyst Picks":
    st.markdown('<div class="cbb-kicker">COLLEGE BASKETBALL INTELLIGENCE</div>', unsafe_allow_html=True)
    st.markdown('<div class="cbb-title">CBB MODEL <span style="color:#fbbf24">//</span> ANALYST PICKS</div>', unsafe_allow_html=True)
    st.markdown(
        '<div class="cbb-subtitle">Official human selections published from Stat Factory - separate from the independent CBB forecast engine</div>',
        unsafe_allow_html=True,
    )
    st.info("Analyst selections are an editorial layer. They may reference model output and sportsbook context, but they do not feed back into or alter the frozen CBB model forecast.")
    render_stat_factory_analyst_picks("cbb", heading=False)
    st.markdown(
        f'<div class="small-muted" style="margin:2rem 0 .5rem">CBB Model Betting Intelligence v{APP_VERSION} - analyst opinions remain separate from the production model</div>',
        unsafe_allow_html=True,
    )
    st.stop()

record: dict[str, Any] | None = None
'''
          if 'if page == "Analyst Picks":' not in text:
              if anchor not in text:
                  raise SystemExit("CBB post-sidebar anchor not found")
              text = text.replace(anchor, block, 1)

          path.write_text(text)
          PY

      - name: Validate Python
        run: python -m py_compile app.py stat_factory_access.py stat_factory_analyst_picks.py pages/1_Analyst_Picks.py

      - name: Commit patched app
        run: |
          if git diff --quiet; then
            echo "No navigation changes needed"
            exit 0
          fi
          git config user.name "stat-factory-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.py
          git commit -m "Expose Analyst Picks in CBB sidebar"
          git push origin HEAD:hotfix/analyst-picks-rollout
