name: Public Display Regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  display:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Activate the current summary renderer in the live app entrypoint
        shell: python
        run: |
          from pathlib import Path
          p=Path('app.py');s=p.read_text()
          old='''from cbb_dashboard.spread_display import install_spread_display
install_spread_display()
st.markdown(GLOBAL_CSS, unsafe_allow_html=True)'''
          new='''from cbb_dashboard.spread_display import install_spread_display
from cbb_dashboard.board_summary_runtime import install_board_summary_runtime
from cbb_dashboard import intelligence as _cbb_intelligence
install_spread_display()
install_board_summary_runtime()
# app.py imports the grid before runtime installation; rebind the local symbol on
# every Streamlit rerun so source-sync workers cannot retain the old renderer.
game_card_grid_html = _cbb_intelligence.game_card_grid_html
st.markdown(GLOBAL_CSS, unsafe_allow_html=True)'''
          assert s.count(old)==1, 'Expected live spread installer block exactly once'
          s=s.replace(old,new,1)
          assert s.count('APP_VERSION = "1.6.3"')==1
          s=s.replace('APP_VERSION = "1.6.3"','APP_VERSION = "1.6.4"',1)
          compile(s,'app.py','exec');p.write_text(s)
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m compileall -q app.py cbb_dashboard
      - run: python -m pytest -q tests/test_board_record_summary.py tests/test_board_summary_runtime.py tests/test_spread_display.py tests/test_bundled_logos.py tests/test_logo_scoreboard_and_splits.py tests/test_conference_moneybar_logo_qa.py
      - name: Commit the verified entrypoint and restore read-only CI
        run: |
          cat > .github/workflows/display_regression.yml <<'YAML'
          name: Public Display Regression
          on:
            pull_request:
            push:
              branches: [main]
          permissions:
            contents: read
          jobs:
            display:
              runs-on: ubuntu-latest
              timeout-minutes: 10
              env:
                PYTHONPATH: .
              steps:
                - uses: actions/checkout@v4
                  with:
                    persist-credentials: false
                - uses: actions/setup-python@v5
                  with:
                    python-version: '3.12'
                    cache: pip
                - run: python -m pip install -r requirements.txt pytest
                - run: python -m pytest -q tests/test_board_record_summary.py tests/test_board_summary_runtime.py tests/test_spread_display.py tests/test_bundled_logos.py tests/test_logo_scoreboard_and_splits.py tests/test_conference_moneybar_logo_qa.py
          YAML
          git config user.name 'Stat Factory maintenance'
          git config user.email 'noreply@users.noreply.github.com'
          git add app.py .github/workflows/display_regression.yml
          if [ -f .github/workflows/one_time_cbb_summary_binding.yml ]; then
            git rm .github/workflows/one_time_cbb_summary_binding.yml
          fi
          git commit -m 'Activate CBB summary cards in the live Streamlit entrypoint'
          git push origin HEAD:main
