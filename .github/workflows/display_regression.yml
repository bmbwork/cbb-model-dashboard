name: Public Display Regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  display:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cfb-style-summary-record-cards-20260914
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Integrate six record cards into the active Game Board once
        shell: python
        run: |
          from pathlib import Path
          p=Path('app.py');s=p.read_text()
          import_line='from cbb_dashboard.board_record_summary import summary_cards as board_record_summary_cards'
          if import_line not in s:
              anchor='from cbb_dashboard.best_odds_archive import attach_best_odds_to_board'
              assert s.count(anchor)==1
              s=s.replace(anchor,anchor+'\n'+import_line,1)
          if 'summary = board_record_summary_cards(filtered)' not in s:
              anchor='''    if filtered.empty:
        st.info("No games match these filters. Widen the odds/ranking/confidence range or choose a different slate date.")
        return

    limit_choice = st.segmented_control'''
              assert s.count(anchor)==1
              replacement='''    if filtered.empty:
        st.info("No games match these filters. Widen the odds/ranking/confidence range or choose a different slate date.")
        return

    summary = board_record_summary_cards(filtered)
    summary_cols = st.columns(6)
    for column, (label, value, foot) in zip(summary_cols, summary):
        with column:
            metric_card(label, value, foot)

    limit_choice = st.segmented_control'''
              s=s.replace(anchor,replacement,1)
          p.write_text(s)
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m compileall -q app.py cbb_dashboard
      - run: python -m pytest -q tests/test_board_record_summary.py tests/test_spread_display.py tests/test_bundled_logos.py tests/test_logo_scoreboard_and_splits.py tests/test_conference_moneybar_logo_qa.py
      - name: Commit active-page integration if needed
        run: |
          git config user.name 'Stat Factory maintenance'
          git config user.email 'noreply@users.noreply.github.com'
          git add app.py
          if ! git diff --cached --quiet; then
            git commit -m 'Show CFB-style record cards on the CBB Game Board'
            git push origin HEAD:feat/cfb-style-summary-record-cards-20260914
          fi
