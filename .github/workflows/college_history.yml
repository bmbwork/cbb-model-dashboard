name: College Season History
on:
  workflow_dispatch:
    inputs:
      season:
        description: Season (CBB uses ending year); blank is current season
        required: false
        type: string
      dry_run:
        description: Inspect provider coverage without database writes
        required: true
        default: false
        type: boolean
  schedule:
    - cron: '43 * * * *'
  push:
    branches: [main]
    paths: ['scripts/collect_college_history.py', '.github/workflows/college_history.yml']
permissions:
  contents: read
concurrency:
  group: college-history
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5
      - name: Capture verified full-season history; no model writes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
          INPUT_SEASON: ${{ inputs.season }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(--sport cbb)
          if [ -n "$INPUT_SEASON" ]; then ARGS+=(--season "$INPUT_SEASON"); fi
          if [ "$INPUT_DRY_RUN" = 'true' ] || [ "$GITHUB_REF" != 'refs/heads/main' ]; then ARGS+=(--dry-run); fi
          python scripts/collect_college_history.py "${ARGS[@]}"
