# Copy this into Streamlit Community Cloud -> App settings -> Secrets.
# Do NOT commit a real .streamlit/secrets.toml file.

ADMIN_EMAIL = "YOUR_GOOGLE_ACCOUNT_EMAIL"

SUPABASE_URL = "https://YOUR_PROJECT.supabase.co"
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_REPLACE_ME"
SUPABASE_SECRET_KEY = "sb_secret_REPLACE_ME"

# Legacy Supabase keys are supported by the app as fallbacks if your project
# has not migrated yet:
# SUPABASE_ANON_KEY = "..."
# SUPABASE_SERVICE_ROLE_KEY = "..."

# v1.4.2 Market Terminal automation — The Odds API primary.
# Get your key from The Odds API and keep it only in Streamlit Secrets.
THE_ODDS_API_KEY = "REPLACE_ME"
THE_ODDS_API_REGIONS = "us"

# Optional: restrict the feed to named bookmaker keys instead of a region.
# If this is non-empty, it takes precedence over THE_ODDS_API_REGIONS.
# Up to 10 named bookmakers have the same quota multiplier as one region.
THE_ODDS_API_BOOKMAKERS = ""

# The named sportsbook used for the actual displayed/ATS reference line when
# available. If unavailable for a game, the adapter falls back to another
# returned named book and preserves that source in the snapshot label.
THE_ODDS_API_REFERENCE_BOOKMAKER = "draftkings"

[auth]
redirect_uri = "https://YOUR-CBB-APP.streamlit.app/oauth2callback"
cookie_secret = "REPLACE_WITH_A_LONG_RANDOM_SECRET"

[auth.google]
client_id = "REPLACE_ME.apps.googleusercontent.com"
client_secret = "REPLACE_ME"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
