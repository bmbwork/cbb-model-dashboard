# Streamlit Community Cloud -> App settings -> Secrets
# Keep application-level values above the first TOML table header.

ADMIN_EMAIL = "YOUR_GOOGLE_ACCOUNT_EMAIL"
SUPABASE_URL = "https://YOUR_PROJECT.supabase.co"
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_REPLACE_ME"
SUPABASE_SECRET_KEY = "sb_secret_REPLACE_ME"

# The Odds API settings MUST remain top-level. Put them before [auth].
THE_ODDS_API_KEY = "REPLACE_ME"
THE_ODDS_API_REGIONS = "us"
THE_ODDS_API_BOOKMAKERS = ""
THE_ODDS_API_REFERENCE_BOOKMAKER = "draftkings"

[auth]
redirect_uri = "https://YOUR-CBB-APP.streamlit.app/oauth2callback"
cookie_secret = "REPLACE_WITH_A_LONG_RANDOM_SECRET"

[auth.google]
client_id = "REPLACE_ME.apps.googleusercontent.com"
client_secret = "REPLACE_ME"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
